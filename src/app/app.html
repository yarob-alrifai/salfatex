<div class="app-shell">
  <header class="sticky top-0 z-50 border-b border-white/40 bg-white/70 backdrop-blur-lg">
    <div class="app-container">
      <div class="flex items-center justify-between gap-4 py-4">
        <a
          routerLink="/"
          class="inline-flex items-center gap-3 rounded-full bg-white/70 px-4 py-2 text-lg font-bold uppercase tracking-[0.35em] text-brand-700 shadow-sm shadow-white/50 transition hover:shadow-md"
        >
          Salfatex
        </a>

        <nav class="hidden items-center gap-1 lg:flex" aria-label="Основная навигация">
          <a
            routerLink="/"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Главная
          </a>
          <a
            routerLink="/categories"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Товары
          </a>
          <a
            routerLink="/about"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            О нас
          </a>
          <a
            routerLink="/cart"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Корзина
          </a>
          <a
            routerLink="/checkout"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Оформление заказа
          </a>

          <a
            *ngIf="isAdminLoggedIn()"
            routerLink="/admin"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Панель администратора
          </a>
          <a
            routerLink="/contact"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Связаться с нами
          </a>

          <a
            *ngIf="!isAdminLoggedIn()"
            routerLink="/admin/login"
            routerLinkActive="!app-button--secondary !bg-brand-50 !text-brand-700"
            (click)="closeMenu()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Войти
          </a>
          <button
            *ngIf="isAdminLoggedIn()"
            type="button"
            (click)="logout()"
            class="app-button app-button--ghost text-sm font-semibold"
          >
            Выйти
          </button>
        </nav>

        <button
          type="button"
          class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-white/70 bg-white/70 text-neutral-700 shadow-sm transition hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-200 lg:hidden"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-controls="primary-navigation"
          aria-label="Показать меню"
        >
          <span class="sr-only">Показать меню</span>
          <span aria-hidden="true" class="flex flex-col items-center justify-center gap-1">
            <span
              class="block h-0.5 w-6 rounded-full bg-current transition-transform duration-200"
              [ngClass]="{ 'translate-y-1.5 rotate-45': isMenuOpen() }"
            ></span>
            <span
              class="block h-0.5 w-6 rounded-full bg-current transition-opacity duration-200"
              [ngClass]="{ 'opacity-0': isMenuOpen() }"
            ></span>
            <span
              class="block h-0.5 w-6 rounded-full bg-current transition-transform duration-200"
              [ngClass]="{ '-translate-y-1.5 -rotate-45': isMenuOpen() }"
            ></span>
          </span>
        </button>
      </div>

      <div *ngIf="isMenuOpen()" class="pb-4 lg:hidden" id="primary-navigation">
        <nav
          class="flex flex-col gap-2 rounded-3xl border border-white/70 bg-white/80 p-3 text-sm font-semibold text-neutral-700 shadow-lg shadow-white/40 backdrop-blur"
          aria-label="Боковое меню"
        >
          <a
            routerLink="/"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            Главная
          </a>
          <a
            routerLink="/categories"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            Товары
          </a>
          <a
            routerLink="/about"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            О нас
          </a>
          <a
            routerLink="/cart"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            Корзина
          </a>
          <a
            routerLink="/checkout"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            Оформление заказа
          </a>

          <a
            routerLink="/admin"
            *ngIf="isAdminLoggedIn()"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            Панель администратора
          </a>
          <a
            routerLink="/contact"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            Связаться с нами
          </a>

          <a
            *ngIf="!isAdminLoggedIn()"
            routerLink="/admin/login"
            routerLinkActive="!bg-brand-100 !text-brand-700"
            (click)="closeMenu()"
            class="rounded-2xl px-4 py-2 transition hover:bg-brand-50"
          >
            Войти
          </a>
          <button
            *ngIf="isAdminLoggedIn()"
            type="button"
            (click)="logout()"
            class="rounded-2xl px-4 py-2 text-left transition hover:bg-brand-50"
          >
            Выйти
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main class="app-shell__content">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-shell__footer">
    <p class="font-semibold tracking-wide">© {{ title() }} {{ currentYear }}</p>
    <p class="mt-1 text-xs text-neutral-500">Все права защищены.</p>
  </footer>
  <app-floating-cart-button></app-floating-cart-button>
</div>
