<div class="flex min-h-screen bg-neutral-50">
  <aside
    class="hidden w-72 flex-col border-e border-white/60 bg-white/90 p-6 shadow-soft backdrop-blur lg:flex"
  >
    <div class="space-y-2 border-b border-white/70 pb-6 text-right">
      <h2 class="text-2xl font-bold text-brand-600">لوحة التحكم</h2>
      <p class="text-sm text-neutral-500">
        {{ admin() ? admin()!.displayName || admin()!.email : '...' }}
      </p>
    </div>

    <!-- Navigation -->
    <nav class="mt-6 flex flex-1 flex-col gap-2 text-right" aria-label="تنقل الأدمن">
      <a
        routerLink="/admin/orders"
        routerLinkActive="!bg-brand-100 !text-brand-700"
        class="rounded-2xl px-4 py-2 text-sm font-medium text-neutral-600 transition hover:bg-brand-50 hover:text-brand-600"
      >
        🛒 الطلبات
      </a>
      <a
        routerLink="/admin/products"
        routerLinkActive="!bg-brand-100 !text-brand-700"
        class="rounded-2xl px-4 py-2 text-sm font-medium text-neutral-600 transition hover:bg-brand-50 hover:text-brand-600"
      >
        📦 المنتجات
      </a>
      <a
        routerLink="/admin/categories"
        routerLinkActive="!bg-brand-100 !text-brand-700"
        class="rounded-2xl px-4 py-2 text-sm font-medium text-neutral-600 transition hover:bg-brand-50 hover:text-brand-600"
      >
        🗂️ التصنيفات
      </a>
      <a
        routerLink="/admin/subcategories"
        routerLinkActive="!bg-brand-100 !text-brand-700"
        class="rounded-2xl px-4 py-2 text-sm font-medium text-neutral-600 transition hover:bg-brand-50 hover:text-brand-600"
      >
        📑 التصنيفات الفرعية
      </a>
    </nav>

    <!-- Logout Button -->
    <button
      type="button"
      class="app-button app-button--dark mt-4 w-full justify-center"
      (click)="signOut()"
      [disabled]="loading()"
    >
      تسجيل الخروج
    </button>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto bg-white/60 p-6 shadow-inner">
    <router-outlet></router-outlet>
  </main>
</div>
