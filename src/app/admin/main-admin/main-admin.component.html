<div class="min-h-screen bg-neutral-50">
  @if (sidebarOpen()) {
  <button
    type="button"
    class="fixed inset-0 z-30 bg-neutral-900/40 backdrop-blur-sm transition-opacity lg:hidden"
    aria-label="إغلاق القائمة الجانبية"
    (click)="closeSidebar()"
  ></button>
  }

  <div class="flex min-h-screen">
    <aside
      id="admin-sidebar"
      class="fixed inset-y-0 left-0 z-40 w-72 transform bg-white shadow-2xl transition-transform duration-300 lg:static lg:translate-x-0 lg:shadow-none"
      [class.-translate-x-full]="!sidebarOpen()"
    >
      <div class="flex h-full flex-col border-r border-neutral-200">
        <div class="flex items-center gap-3 px-6 py-6">
          <div
            class="flex h-12 w-12 items-center justify-center rounded-2xl bg-neutral-900 text-white"
          >
            <span class="text-xl font-semibold">SA</span>
          </div>
          <div>
            <p class="text-base font-semibold text-neutral-900">salfatex admin</p>
            <p class="text-xs text-neutral-500">لوحة إدارة متكاملة</p>
          </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-4 pb-8">
          <p class="px-2 text-xs font-semibold uppercase tracking-widest text-neutral-400">
            التنقل الرئيسي
          </p>
          <ul class="mt-4 space-y-2 text-sm font-medium">
            <li>
              <a
                routerLink="/admin/orders"
                routerLinkActive="!bg-neutral-900 !text-white"
                class="flex items-center gap-3 rounded-xl px-3 py-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                (click)="closeSidebar()"
              >
                <span
                  class="flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100 text-neutral-600"
                  >🛒</span
                >
                <span>الطلبات</span>
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/products"
                routerLinkActive="!bg-neutral-900 !text-white"
                class="flex items-center gap-3 rounded-xl px-3 py-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                (click)="closeSidebar()"
              >
                <span
                  class="flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100 text-neutral-600"
                  >📦</span
                >
                <span>المنتجات</span>
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/categories"
                routerLinkActive="!bg-neutral-900 !text-white"
                class="flex items-center gap-3 rounded-xl px-3 py-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                (click)="closeSidebar()"
              >
                <span
                  class="flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100 text-neutral-600"
                  >🗂️</span
                >
                <span>التصنيفات</span>
              </a>
            </li>

            <li>
              <a
                routerLink="/admin/category-groups"
                routerLinkActive="!bg-neutral-900 !text-white"
                class="flex items-center gap-3 rounded-xl px-3 py-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                (click)="closeSidebar()"
              >
                <span
                  class="flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100 text-neutral-600"
                  >🏷️</span
                >
                <span>التصنيفات الرئيسية</span>
              </a>
            </li>

            <li>
              <a
                routerLink="/admin/subcategories"
                routerLinkActive="!bg-neutral-900 !text-white"
                class="flex items-center gap-3 rounded-xl px-3 py-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                (click)="closeSidebar()"
              >
                <span
                  class="flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100 text-neutral-600"
                  >📑</span
                >
                <span>التصنيفات الفرعية</span>
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/customers"
                routerLinkActive="!bg-neutral-900 !text-white"
                class="flex items-center gap-3 rounded-xl px-3 py-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                (click)="closeSidebar()"
              >
                <span
                  class="flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100 text-neutral-600"
                  >👥</span
                >
                <span>الزبائن</span>
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/contact"
                routerLinkActive="!bg-neutral-900 !text-white"
                class="flex items-center gap-3 rounded-xl px-3 py-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                (click)="closeSidebar()"
              >
                <span
                  class="flex h-9 w-9 items-center justify-center rounded-lg bg-neutral-100 text-neutral-600"
                  >📞</span
                >
                <span>بيانات التواصل</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="border-t border-neutral-200 px-6 py-5">
          <p class="text-xs text-neutral-500">جاهز للمساعدة؟</p>
          <button
            type="button"
            class="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-neutral-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-neutral-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900 disabled:opacity-60"
            (click)="signOut()"
            [disabled]="loading()"
          >
            <span>تسجيل الخروج</span>
            @if (loading()) {
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              ></path>
            </svg>
            }
          </button>
        </div>
      </div>
    </aside>

    <div class="flex flex-1 flex-col">
      <header
        class="flex items-center justify-between border-b border-neutral-200 bg-white px-4 py-4 shadow-sm sm:px-6 lg:hidden"
      >
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-neutral-900 text-white"
          >
            <span class="text-lg font-semibold">SA</span>
          </div>
          <div>
            <p class="text-sm font-semibold text-neutral-900">salfatex admin</p>
            <p class="text-xs text-neutral-500">لوحة التحكم</p>
          </div>
        </div>
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg border border-neutral-200 bg-white px-3 py-2 text-sm font-medium text-neutral-700 shadow-sm transition hover:bg-neutral-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900"
          (click)="toggleSidebar()"
          aria-controls="admin-sidebar"
          [attr.aria-expanded]="sidebarOpen()"
        >
          <span class="sr-only">فتح القائمة الجانبية</span>
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </header>
      <main class="flex-1">
        <div class="px-4 pb-12 sm:px-6 lg:px-10">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>
