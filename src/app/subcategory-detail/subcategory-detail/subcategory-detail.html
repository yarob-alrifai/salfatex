<section class="app-section space-y-10" *ngIf="viewModel$ | async as vm; else loading">
  <header class="space-y-6">
    <app-back-button label="Назад к предыдущему списку"></app-back-button>
  </header>

  <section class="space-y-6">
    <div
      class="flex flex-col gap-4 rounded-3xl border border-white/60 bg-white/90 p-5 shadow-soft backdrop-blur sm:flex-row sm:items-center sm:justify-between"
    >
      <h2 class="text-lg font-semibold text-neutral-900">
        Доступные товары ({{ vm.filteredProducts.length }})
      </h2>

      <label class="flex items-center gap-3">
        <span class="app-chip bg-brand-50/80 text-brand-600">Поиск по товарам</span>
        <input
          type="search"
          name="subcategory-search"
          class="app-input app-input--small w-full sm:w-72"
          placeholder="Введите название или цвет товара"
          [ngModel]="vm.searchTerm"
          (ngModelChange)="updateSearch($event)"
        />
      </label>
    </div>

    <div
      *ngIf="vm.filteredProducts.length; else empty"
      class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
    >
      <article
        *ngFor="let product of vm.filteredProducts; trackBy: trackByProductId"
        class="app-card flex h-full flex-col gap-4 text-left transition hover:-translate-y-1 hover:shadow-brand"
      >
        <a
          class="group flex flex-col gap-4"
          [routerLink]="[
            '/categories',
            vm.categoryId,
            'subcategories',
            vm.subcategory?.id ?? vm.subcategoryId,
            'products',
            product.id
          ]"
          (click)="$event.stopPropagation()"
        >
          <img
            class="h-44 w-full rounded-2xl object-cover transition duration-200 group-hover:scale-[1.02]"
            [ngSrc]="product.mainImageUrl || ''"
            [alt]="product.name"
            width="640"
            height="352"
            loading="lazy"
            decoding="async"
          />

          <div class="space-y-2">
            <h3 class="text-lg font-semibold text-neutral-900">{{ product.name }}</h3>
            <p class="text-sm font-semibold text-brand-600">
              {{ getSelectedUnitPrice(product) | number : '1.0-0' }} RUB
            </p>

            <div class="flex flex-wrap gap-2">
              <button
                type="button"
                *ngFor="let option of getAvailableUnitOptions(product); trackBy: trackUnitType"
                class="rounded-full border px-3 py-1 text-sm transition"
                [class.bg-brand-600]="isSelectedUnit(product, option)"
                [class.text-white]="isSelectedUnit(product, option)"
                [class.border-brand-600]="isSelectedUnit(product, option)"
                [class.text-brand-600]="!isSelectedUnit(product, option)"
                [class.border-brand-200]="!isSelectedUnit(product, option)"
                (click)="
                  selectUnit(product.id, option.type);
                  $event.preventDefault();
                  $event.stopPropagation()
                "
              >
                {{ getUnitLabel(option) }}
              </button>
            </div>

            <div
              *ngIf="getAvailableFabrics(product).length > 1"
              class="flex flex-wrap justify-start gap-2 text-xs text-neutral-600"
            >
              <button
                type="button"
                *ngFor="let fabric of getAvailableFabrics(product); index as fabricIndex"
                class="rounded-full border px-2 py-1 transition"
                [class.bg-brand-500]="isSelectedFabric(product, fabricIndex)"
                [class.text-white]="isSelectedFabric(product, fabricIndex)"
                [class.border-brand-500]="isSelectedFabric(product, fabricIndex)"
                [class.text-brand-600]="!isSelectedFabric(product, fabricIndex)"
                [class.border-brand-200]="!isSelectedFabric(product, fabricIndex)"
                (click)="
                  selectFabric(product, fabricIndex);
                  $event.preventDefault();
                  $event.stopPropagation()
                "
              >
                {{ fabric.name }}
              </button>
            </div>

            <div
              *ngIf="getAvailableColors(product).length"
              class="flex flex-wrap justify-start gap-2 text-xs text-neutral-600"
            >
              <button
                type="button"
                *ngFor="let color of getAvailableColors(product)"
                class="rounded-full border px-2 py-1 transition"
                [class.bg-brand-500]="isSelectedColor(product, color)"
                [class.text-white]="isSelectedColor(product, color)"
                [class.border-brand-500]="isSelectedColor(product, color)"
                [class.text-brand-600]="!isSelectedColor(product, color)"
                [class.border-brand-200]="!isSelectedColor(product, color)"
                (click)="
                  selectColor(product.id, color); $event.preventDefault(); $event.stopPropagation()
                "
              >
                {{ color }}
              </button>
            </div>
          </div>
        </a>

        <div class="mt-auto pt-2">
          <ng-container *ngIf="getQuantity(product) === 0; else quantityControls">
            <button
              type="button"
              class="app-button app-button--primary w-full"
              (click)="addToCart($event, product)"
            >
              Добавить в корзину
            </button>
          </ng-container>

          <ng-template #quantityControls>
            <div
              class="flex w-full flex-col justify-center gap-3 sm:flex-row sm:items-center sm:gap-4"
            >
              <button
                type="button"
                class="h-11 min-w-[3.25rem] rounded-full border border-brand-200 bg-white px-4 text-sm font-semibold text-brand-600 shadow-sm transition hover:bg-brand-50"
                (click)="decrement($event, product, 5)"
                aria-label="Уменьшить на 5 единиц"
              >
                −5
              </button>

              <div
                class="inline-flex items-center justify-center rounded-full border border-brand-200 bg-brand-50/70 text-brand-700 shadow-sm"
              >
                <button
                  type="button"
                  class="h-11 w-11 text-xl font-semibold transition hover:text-brand-600"
                  (click)="decrement($event, product)"
                  aria-label="Уменьшить количество"
                >
                  −
                </button>
                <span class="min-w-[3rem] text-center text-base font-semibold">
                  {{ getQuantity(product) }}
                </span>
                <button
                  type="button"
                  class="h-11 w-11 text-xl font-semibold transition hover:text-brand-600"
                  (click)="increment($event, product)"
                  aria-label="Увеличить количество"
                >
                  +
                </button>
              </div>

              <button
                type="button"
                class="h-11 min-w-[3.25rem] rounded-full bg-brand-600 px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700"
                (click)="increment($event, product, 5)"
                aria-label="Увеличить на 5 единиц"
              >
                +5
              </button>
            </div>
          </ng-template>
        </div>
      </article>
    </div>

    <ng-template #empty>
      <ng-container *ngIf="vm.products.length === 0; else noFilteredResults">
        <div class="app-empty">В этом подразделе пока нет товаров.</div>
      </ng-container>
    </ng-template>

    <ng-template #noFilteredResults>
      <div class="app-empty text-brand-600">Нет товаров, соответствующих текущему запросу.</div>
    </ng-template>
  </section>
</section>

<ng-template #loading>
  <div class="app-empty">Загрузка данных подраздела...</div>
</ng-template>
